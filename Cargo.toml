[workspace]
resolver = "2"
members = [
    "crates/pinex-proto",
    "crates/pinex-device",
    "crates/pinex-ui",
    "crates/pinex-input",
    "crates/pinex-web",
    "crates/pinex",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/andrewhao/pinex"

[workspace.dependencies]
pinex-proto = { path = "crates/pinex-proto" }
pinex-device = { path = "crates/pinex-device", default-features = false }
pinex-input = { path = "crates/pinex-input" }
pinex-ui = { path = "crates/pinex-ui" }
pinex-web = { path = "crates/pinex-web" }
crc = "3"
embedded-graphics = "0.8"
# Pi-only display and GPIO. Behind the `hat` feature so a Mac build and
# `cargo test` never need them — rppal is Linux-only.
rppal = { version = "0.22", features = ["hal"] }
mipidsi = "0.10"
display-interface-spi = "0.5"
embedded-hal = "1.0"
nix = { version = "0.29", features = ["term", "fs", "poll"] }
